[package]
name = "capture_delegate_backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "capture-delegate-backend"
path = "src/main.rs"

[dependencies]
libc = "0.2"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
